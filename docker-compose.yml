name: mercator

services:
  db:
    image: postgres:18.4
    volumes:
      - db_data:/var/lib/postgresql/18/docker
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mercator}
      POSTGRES_USER: ${POSTGRES_USER:-mercator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercator} -d ${POSTGRES_DB:-mercator}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Offline stand-in for the external BORME/BOE services.
  wiremock:
    image: wiremock/wiremock:3.13.2
    command: [ "--verbose", "--disable-banner" ]
    volumes:
      - ./docker/acceptance/wiremock:/home/wiremock:ro
    ports:
      - '127.0.0.1:${WIREMOCK_PORT:-8090}:8080'

  # Gated behind the `app` profile so a dev `docker compose up` starts only the backing services.
  app:
    image: ${MERCATOR_IMAGE:-mercator:latest}
    profiles: [app]
    depends_on:
      db:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      MICRONAUT_ENVIRONMENTS: prod
      JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mercator}
      DB_USER: ${POSTGRES_USER:-mercator}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Forward-looking: the ingestion engine that fetches these URLs isn't built yet, so this base-URL
      # seam is wired ready for it (ADR-0018) — nothing reads it today.
      MERCATOR_SOURCE_BOE_BASE_URL: http://wiremock:8080
      MERCATOR_IMPORTS_HISTORICAL_ENABLED: "true"
    expose:
      - "8080"

volumes:
  db_data:
