# Acceptance stack — a throwaway Postgres, a WireMock standing in for the external BORME/BOE services,
# and the production application image. Driven by Testcontainers' ComposeContainer (see src/acceptance),
# not for manual `docker compose up`.
#
# The app image is behind the `app` profile: this file brings up only the backing services by default,
# or the full stack with `--profile app` (the suite activates it via COMPOSE_PROFILES). Ports are only
# `expose`d — Testcontainers maps them to random host ports, so parallel runs never clash. MERCATOR_IMAGE
# must name the image to run: the Gradle task supplies `dockerBuild`'s `<project>:latest`; for a manual
# run set it yourself (e.g. MERCATOR_IMAGE=mercator:latest).
name: mercator-acceptance

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: mercator
      POSTGRES_USER: mercator
      POSTGRES_PASSWORD: change_me
    # Flyway's baseline migration creates the required extensions (pg_trgm, fuzzystrmatch,
    # unaccent), so no init.sql seeding is needed for the acceptance run.
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mercator -d mercator" ]
      interval: 5s
      timeout: 5s
      retries: 12

  wiremock:
    image: wiremock/wiremock:3.13.2
    # Offline stand-in for the external BORME/BOE services: deterministic, no network. Stub mappings +
    # bodies are mounted read-only from docker/acceptance/wiremock; --verbose logs unmatched requests.
    command: [ "--verbose", "--disable-banner" ]
    volumes:
      - ./wiremock:/home/wiremock:ro
    expose:
      - "8080"

  app:
    image: ${MERCATOR_IMAGE:?set MERCATOR_IMAGE to the application image tag (see header)}
    profiles:
      - app
    depends_on:
      db:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      # Run the deployed `prod` profile (fail-closed: no fallback secrets) against the stack's db.
      MICRONAUT_ENVIRONMENTS: prod
      JDBC_URL: jdbc:postgresql://db:5432/mercator
      DB_USER: mercator
      DB_PASSWORD: change_me
      # Forward-looking: points the BORME/BOE fetch layer at WireMock. The ingestion engine that builds
      # the document URLs isn't built yet, so this base-URL seam is wired ready for it (ADR-0018).
      MERCATOR_SOURCE_BOE_BASE_URL: http://wiremock:8080
      # Open the gated historical-import endpoint so the acceptance tests have a live route to drive.
      MERCATOR_IMPORTS_HISTORICAL_ENABLED: "true"
    expose:
      - "8080"
