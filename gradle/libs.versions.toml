[versions]
archunit          = "1.4.2"
assertj           = "3.27.7"
assertj-db        = "3.0.2"
checkstyle        = "13.4.2"
cpd-plugin        = "3.5"
errorprone        = "2.50.0"
errorprone-plugin = "5.1.0"
findsecbugs       = "1.14.0"
flyway            = "12.11.0"
jakarta-inject    = "2.0.1"
jsoup             = "1.22.2"
junit-jupiter     = "6.1.2"
logback           = "1.5.38"
mockito           = "5.23.0"
nullaway          = "0.13.8"
pdfbox            = "3.0.8"
pmd               = "7.24.0"
postgresql        = "42.7.13"
rest-assured      = "6.0.1"
slf4j             = "2.0.18"
spotbugs-plugin   = "6.5.9"
spotbugs-tool     = "4.10.2"
testcontainers    = "1.21.4"
wiremock          = "3.13.2"

[libraries]
archunit                  = { module = "com.tngtech.archunit:archunit",                 version.ref = "archunit" }
assertj-core              = { module = "org.assertj:assertj-core",                       version.ref = "assertj" }
assertj-db                = { module = "org.assertj:assertj-db",                         version.ref = "assertj-db" }
errorprone-core           = { module = "com.google.errorprone:error_prone_core",         version.ref = "errorprone" }
findsecbugs-plugin        = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin",    version.ref = "findsecbugs" }
flyway-core               = { module = "org.flywaydb:flyway-core",                     version.ref = "flyway" }
flyway-postgresql         = { module = "org.flywaydb:flyway-database-postgresql",      version.ref = "flyway" }
jakarta-inject-api        = { module = "jakarta.inject:jakarta.inject-api",              version.ref = "jakarta-inject" }
jsoup                     = { module = "org.jsoup:jsoup",                                version.ref = "jsoup" }
junit-jupiter             = { module = "org.junit.jupiter:junit-jupiter",              version.ref = "junit-jupiter" }
junit-platform-launcher   = { module = "org.junit.platform:junit-platform-launcher" }
logback-classic           = { module = "ch.qos.logback:logback-classic",               version.ref = "logback" }
mockito-core              = { module = "org.mockito:mockito-core",                       version.ref = "mockito" }
mockito-junit-jupiter     = { module = "org.mockito:mockito-junit-jupiter",             version.ref = "mockito" }
nullaway                  = { module = "com.uber.nullaway:nullaway",                      version.ref = "nullaway" }
pdfbox                    = { module = "org.apache.pdfbox:pdfbox",                       version.ref = "pdfbox" }
postgresql                = { module = "org.postgresql:postgresql",                     version.ref = "postgresql" }
rest-assured              = { module = "io.rest-assured:rest-assured",                  version.ref = "rest-assured" }
slf4j-api                 = { module = "org.slf4j:slf4j-api",                          version.ref = "slf4j" }
testcontainers            = { module = "org.testcontainers:testcontainers",             version.ref = "testcontainers" }
testcontainers-junit      = { module = "org.testcontainers:junit-jupiter",              version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql",               version.ref = "testcontainers" }
wiremock                  = { module = "org.wiremock:wiremock-standalone",               version.ref = "wiremock" }

[plugins]
cpd                   = { id = "de.aaschmid.cpd",          version.ref = "cpd-plugin" }
errorprone            = { id = "net.ltgt.errorprone",      version.ref = "errorprone-plugin" }
micronaut-application = { id = "io.micronaut.application", version = "5.0.2" }
spotbugs              = { id = "com.github.spotbugs",      version.ref = "spotbugs-plugin" }
