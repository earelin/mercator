micronaut:
  application:
    name: mercator

mercator:
  imports:
    historical:
      # Gate for the massive historical-import admin endpoint. A bulk-import trigger is a footgun
      # if left always-on, so it defaults OFF; an operator opts in for a backfill window via
      # MERCATOR_IMPORTS_HISTORICAL_ENABLED=true. When false the endpoint routes are absent (404).
      enabled: ${MERCATOR_IMPORTS_HISTORICAL_ENABLED:false}

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/mercator`}
    username: ${DB_USER:`mercator`}
    password: ${DB_PASSWORD:`change_me`}
    driver-class-name: org.postgresql.Driver

flyway:
  datasources:
    default:
      enabled: true
